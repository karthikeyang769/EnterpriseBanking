global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'banking-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:5000', 'banking-apigateway:8080']

  - job_name: 'identity-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:5001', 'identity-service:8080']

  - job_name: 'customer-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:5002', 'customer-service:8080']

  - job_name: 'account-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:5003', 'account-service:8080']

  - job_name: 'transaction-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:5004', 'transaction-service:8080']

  - job_name: 'payment-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:5006', 'payment-service:8080']
